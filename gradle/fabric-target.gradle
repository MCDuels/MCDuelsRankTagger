def minecraftVersion = property('minecraft_version')
def isObfuscated = property('obfuscated').toBoolean()
def javaVersion = property('java_version') as int
def minecraftRange = property('minecraft_range')
def variants = property('variants').split(',')*.trim().findAll { !it.isEmpty() }
def modConfiguration = { String name -> isObfuscated ? "mod${name.capitalize()}" : name }

apply plugin: isObfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'

version = "${rootProject.mod_version}+${minecraftVersion}"
group = rootProject.maven_group
base { archivesName = rootProject.archives_base_name }

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
}

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    java.srcDir rootProject.file('fabric/src/main/java')
    variants.each { java.srcDir rootProject.file("fabric/src/variants/${it}/java") }
    resources.srcDir rootProject.file('fabric/src/main/resources')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (isObfuscated) {
        mappings loom.officialMojangMappings()
    }
    add(modConfiguration('implementation'), "net.fabricmc:fabric-loader:${rootProject.loader_version}")
    add(modConfiguration('implementation'), "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}")
    add(modConfiguration('api'), "me.shedaniel.cloth:cloth-config-fabric:${property('cloth_config_version')}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    add(modConfiguration('compileOnly'), "com.terraformersmc:modmenu:${property('mod_menu_version')}")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = javaVersion
}

processResources {
    def expansions = [
        version: project.version,
        minecraft_range: minecraftRange,
        java_version: javaVersion
    ]
    inputs.properties expansions
    filesMatching('fabric.mod.json') { expand expansions }
}

jar {
    from(rootProject.file('LICENSE')) { rename { "${it}_${rootProject.archives_base_name}" } }
}
